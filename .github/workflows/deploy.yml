name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.build.outputs.tarball }}        # exposed to downstream jobs
    steps:
      - uses: actions/checkout@v7
      - id: build                                          # gives this step an addressable name
        run: ./scripts/build.sh                            # the script writes "tarball=..." to $GITHUB_OUTPUT
      - name: Package release bundle
        run: |
          mkdir -p dist
          cp -r scripts dist/
      - uses: actions/upload-artifact@v6
        with:
          name: pipeline-bundle
          path: ./dist

  deploy-dev:
    needs: build
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: pipeline-bundle, path: dist }
      - run: |
          chmod +x dist/scripts/*.sh
          ./dist/scripts/fake_deploy.sh dev
 
  deploy-test:
    needs: deploy-dev
    environment: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: pipeline-bundle, path: dist }
      - run: |
          chmod +x dist/scripts/*.sh
          ./dist/scripts/fake_deploy.sh test

  deploy-prod:
    needs: deploy-test
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: pipeline-bundle, path: dist }
      - run: |
          chmod +x dist/scripts/*.sh
          ./dist/scripts/fake_deploy.sh prod
